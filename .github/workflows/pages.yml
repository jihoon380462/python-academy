name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  verify:
    # 배포 전 게이트: 콘텐츠 스키마 검사 + 모든 정답 코드 CPython 실행. 하나라도 실패하면 배포하지 않는다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: validate_content
        run: node tools/validate_content.mjs
      - name: run_solutions
        run: node tools/extract.mjs tools/.out && python3 tools/run_solutions.py
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Cancel any stuck in-progress Pages deployment from recent commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --deepen=15 origin main >/dev/null 2>&1 || true
          for sha in $(git log --format=%H -n 15); do
            if [ "$sha" != "${{ github.sha }}" ]; then
              gh api -X POST "repos/${{ github.repository }}/pages/deployments/$sha/cancel" >/dev/null 2>&1 && echo "cancelled stuck deployment $sha" || true
            fi
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Retry after 75s if a previous deployment was still in progress
        if: steps.deployment.outcome == 'failure'
        run: sleep 75
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Retry once more after 90s
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: sleep 90
      - id: deployment3
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@v4
