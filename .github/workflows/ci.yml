name: PR Check
# main 으로 가는 PR 마다: 스키마 검사 + 교과서 검사(check_book — 예시 답 실제 실행) + 정답 코드 CPython 실행 + 브라우저 회귀(Playwright).
# main 의 브랜치 보호 규칙에서 "verify" 체크를 필수로 걸면, 이 잡이 초록이 아닌 PR 은 병합할 수 없다 (specs/workflow.md 8절).
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
# TODO F0 ③: 같은 PR 에 연달아 푸시하면 이전 검사는 취소하고 마지막 것만 돈다
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
# 파이썬 출력을 줄마다 바로 내보내 run 로그의 시각이 실제 검사 시각과 맞게(버퍼링 때문에 「78초 걸린 검사」로 잘못 보였음)
env:
  PYTHONUNBUFFERED: '1'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: validate_content
        run: node tools/validate_content.mjs
      - name: check_level (난이도 래칫 게이트, DESIGN 14-2절)
        run: node tools/check_level.mjs --gate
      - name: check_nesting (괄호 지옥 — 함수 호출 3겹 이상 줄 0개, v2.8.2)
        run: node tools/check_nesting.mjs
      - name: check_book (파이썬 교과서 — 필요한 문법 링크·예시 답 실행, v2.9.0)
        run: |
          sudo apt-get install -y -qq nasm  # v2.31.0~ 어셈블리어 교과서: 예시 답 · 예제를 nasm · ld · gcc 로 진짜 빌드 · 실행(tools/asm_book_run.py)
          pip install --quiet fastapi httpx requests numpy pytest pandas matplotlib scikit-learn  # v2.32.0~ LLM 기초: numpy · v2.33.0~ 디버깅(pytest) · 데이터 분석(pandas · matplotlib) · 머신러닝(scikit-learn)  # v2.28.0~ HTTP·API·SDK 교과서: FastAPI 예제·예시 답을 TestClient 로 실제 실행, 챕터 4 SDK 는 requests 를 import(인터넷 API 는 안 부름)
          node tools/check_book.mjs
      - name: run_solutions
        run: node tools/extract.mjs tools/.out && python3 tools/run_solutions.py
      # v2.19.0 N13: test_shell · run_shell_solutions · run_sql_solutions 는 옛 문제집 화면(가짜 셸·SQL 채점)용이라 archive/classic/tools 로 옮김
      - name: regress (Playwright)
        run: |
          pip install --quiet playwright pillow
          # 브라우저는 러너에 깔린 /usr/bin/google-chrome 을 쓴다(regress.py·run_web_solutions.py 의 executable_path) — playwright install --with-deps 는 쓰지 않는 브라우저+apt 글꼴을 받느라 1.5~14분 걸려서 뺌 (TODO F0)
          test -x /usr/bin/google-chrome
          python3 tools/regress.py
          python3 tools/run_web_solutions.py # 웹 교과서: 만들어 보기 예시 답을 미리보기(tools/web-preview.js)에 넣고 checks 전부 ✓ 인지 (Playwright)
