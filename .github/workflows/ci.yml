name: PR Check
# 팀(Opus QA·콘텐츠) 브랜치의 PR 게이트. main 으로 가는 PR 마다: 스키마 검사 + 정답 코드 CPython 실행 + 셸 시뮬레이터 테스트 + 브라우저 회귀(Playwright).
# main 의 브랜치 보호 규칙에서 "verify" 체크를 필수로 걸면, 이 잡이 초록이 아닌 PR 은 병합할 수 없다 (specs/workflow.md 8절).
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: validate_content
        run: node tools/validate_content.mjs
      - name: check_level (난이도 래칫 게이트, DESIGN 14-2절)
        run: node tools/check_level.mjs --gate
      - name: run_solutions
        run: node tools/extract.mjs tools/.out && python3 tools/run_solutions.py
      - name: test_shell
        run: node tools/test_shell.mjs
      - run: node tools/run_shell_solutions.mjs # terminal-git 미션·명령 순서 정답을 셸 시뮬레이터로 실행해 goals/expect 통과 확인
      - run: python3 tools/run_sql_solutions.py # sql 코스 정답 쿼리·예제를 Python sqlite3 로 실행해 에러 없음·1행 이상 확인
      - name: regress (Playwright)
        run: |
          pip install --quiet playwright pillow
          python3 -m playwright install --with-deps chromium
          python3 tools/regress.py
          python3 tools/run_web_solutions.py # web 코스: 모든 web 문제의 solution 을 미리보기 iframe 에 넣고 checks 전부 ✓ 인지 (Playwright)
