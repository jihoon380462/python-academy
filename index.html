<!DOCTYPE html>
<html lang="ko" data-theme="dark" data-font="1">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>파이썬 아카데미 — 블록에서 텍스트까지, 브라우저에서 진짜 파이썬</title>
<style>
/* =====================================================================
   === UI (스타일) ===
   ===================================================================== */
:root{--mono:"Cascadia Code","Fira Code","D2Coding","Consolas","Menlo",monospace;--sans:-apple-system,"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--radius:12px;--code-size:14px;--fs:15px;
 --ed-bg:#1e1e2e;--ed-fg:#cdd6f4;--ed-kw:#cba6f7;--ed-str:#a6e3a1;--ed-num:#fab387;--ed-com:#6c7086}
[data-theme=dark]{--bg:#0f1117;--surface:#181b26;--surface2:#222636;--border:#2d3247;--text:#e6e8f0;--muted:#8b90a8;--primary:#6c8cff;--primary2:#4f6fe6;--accent:#2bb673;--accent2:#1f9a5f;--danger:#ff5d6c;--warn:#ffb347;--gold:#ffd166;--shadow:0 6px 24px rgba(0,0,0,.35)}
[data-theme=light]{--bg:#f4f6fb;--surface:#ffffff;--surface2:#eef1f8;--border:#d9deea;--text:#1d2230;--muted:#6b7187;--primary:#3f63e8;--primary2:#2f4fc4;--accent:#1f9a5f;--accent2:#177a4a;--danger:#e0405a;--warn:#e69500;--gold:#d9a400;--shadow:0 6px 20px rgba(30,40,80,.12)}
[data-font="0"]{--fs:13.5px;--code-size:13px}[data-font="1"]{--fs:15px;--code-size:14px}[data-font="2"]{--fs:17.5px;--code-size:16px}
[data-anim="0"] *{animation:none!important;transition:none!important}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:var(--fs);line-height:1.55}
button{font:inherit;cursor:pointer}textarea,input,select{font:inherit}a{color:var(--primary);cursor:pointer}
code,pre,.code,.stdin,.out{font-family:var(--mono)}
pre{margin:0;white-space:pre-wrap;word-break:break-word}
h2,h3{margin:.2em 0 .5em}h2 small,h3 small{color:var(--muted);font-weight:normal;font-size:.7em}
.muted{color:var(--muted)}.small{font-size:.85em}.center{text-align:center}.ok{color:var(--accent);font-weight:600}.warn{color:var(--warn)}.big{font-size:2.2em;font-weight:800}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}.row.center{justify-content:center}
.lbl{display:block;font-size:.85em;color:var(--muted);margin:10px 0 4px;font-weight:600}.lbl.inline{display:inline-flex;align-items:center;gap:6px;margin:0}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);font-size:.8em;margin-right:4px}.chip.boss{background:#7b1e3a;color:#fff;border-color:#a33}.chip.hot{background:var(--gold);color:#222;border-color:transparent}.chip.xp{color:var(--gold)}
.tag{font-size:.8em;color:var(--muted)}
.stars{color:var(--gold);letter-spacing:1px}.stars .dim{color:var(--border)}
.input{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text)}
select{padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text)}
/* 버튼 */
.btn{min-height:44px;padding:8px 16px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-weight:600;display:inline-flex;align-items:center;gap:6px;justify-content:center;transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.1)}.btn:active{transform:scale(.96)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--primary);border-color:transparent;color:#fff}.btn.accent{background:var(--accent);border-color:transparent;color:#fff}.btn.danger{background:var(--danger);border-color:transparent;color:#fff}.btn.tutor{background:linear-gradient(135deg,#8e6cff,#5b8def);border-color:transparent;color:#fff}
.btn.sm{min-height:36px;padding:4px 12px;font-size:.9em}.btn.xs{min-height:28px;padding:2px 8px;font-size:.8em}.btn.big{font-size:1.1em;padding:12px 24px}
.btn kbd{font-size:.7em;opacity:.7;border:1px solid rgba(255,255,255,.3);border-radius:4px;padding:0 4px;margin-left:4px}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--border);border-radius:10px;overflow:hidden}.seg button{min-height:40px;padding:6px 14px;border:0;background:transparent;color:var(--muted)}.seg button.on{background:var(--primary);color:#fff}.seg.big{display:flex;width:100%}.seg.big button{flex:1;padding:12px 8px;font-size:1.05em;white-space:nowrap}
/* 상단바 */
#topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--surface);border-bottom:1px solid var(--border);min-height:52px}
.tb-btn{min-width:44px;min-height:44px;border:0;background:transparent;color:var(--text);font-size:1.3em;border-radius:10px;display:flex;align-items:center;justify-content:center}.tb-btn:hover{background:var(--surface2)}
.tb-title{flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-xp{display:flex;align-items:center;gap:6px;font-size:.85em}.tb-lv{font-weight:800;color:var(--gold)}.tb-xpn{color:var(--muted);font-size:.85em}
.xpbar{width:90px;height:10px;background:var(--surface2);border-radius:999px;overflow:hidden;border:1px solid var(--border)}.xpbar.big{width:100%;height:14px;margin:8px 0}.xpfill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .6s}
.tb-combo{font-weight:800;padding:2px 8px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);font-size:.85em;animation:pop .3s}.tb-combo.t1{color:var(--warn);border-color:var(--warn)}.tb-combo.t2{color:#ff8c42;border-color:#ff8c42}.tb-combo.t3{color:#fff;background:linear-gradient(90deg,#ff3b5c,#ff8c42);border-color:transparent}
.tb-streak{font-weight:700;opacity:.4}.tb-streak.on{opacity:1}
#view{padding:14px;max-width:1280px;margin:0 auto;min-height:calc(100vh - 60px)}
/* 토스트/모달 */
#toasts{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);padding:10px 16px;border-radius:10px;opacity:0;transform:translateY(-10px);transition:.3s}.toast.show{opacity:1;transform:none}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:400;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;max-width:420px;width:100%;box-shadow:var(--shadow);animation:pop .25s}.modal.wide{max-width:560px}
.modal-title{font-weight:800;font-size:1.15em;padding:16px 18px 6px}.modal-body{padding:6px 18px}.modal-btns{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px 16px;flex-wrap:wrap}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
/* 카드 */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}.card.hot{border-color:var(--gold)}.card-h{font-weight:700;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}.card-h small{color:var(--muted);font-weight:normal}
.page{max-width:900px;margin:0 auto}
/* 홈 */
.home{display:grid;grid-template-columns:1fr 320px;gap:16px}
.map{min-width:0}.side{min-width:0}
.ch-sec{border-left:4px solid var(--chc);padding:4px 0 10px 14px;margin-bottom:14px;position:relative}.ch-sec.locked{opacity:.55}
.ch-title{font-weight:800;color:var(--chc);display:flex;gap:10px;align-items:center;margin-bottom:8px}.ch-title .lock{font-size:.8em;color:var(--muted);font-weight:normal}.ch-decor{font-size:1.4em;animation:pop .6s}
.nodes{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;position:relative}
.nodes::before{content:"";position:absolute;left:30px;right:30px;top:40px;border-top:3px dashed var(--border);z-index:0}
.node{position:relative;z-index:1;width:120px;min-height:96px;border-radius:14px;border:2px solid var(--border);background:var(--surface);color:var(--text);padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .12s}.node:hover:not(:disabled){transform:translateY(-3px)}
.node-ic{width:44px;height:44px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.1em;border:2px solid var(--chc,var(--border))}
.node-t{font-size:.8em;line-height:1.25;text-align:center;word-break:keep-all}.node-stars{color:var(--gold);font-size:.8em;letter-spacing:1px}
.node.done .node-ic{background:var(--accent);color:#fff;border-color:transparent}.node.done{border-color:var(--accent)}
.node.cur{border-color:var(--chc,var(--primary));animation:pulse 1.6s infinite;box-shadow:0 0 0 0 var(--chc,var(--primary))}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(108,140,255,.55)}70%{box-shadow:0 0 0 12px rgba(108,140,255,0)}100%{box-shadow:0 0 0 0 rgba(108,140,255,0)}}
.node.locked{opacity:.5;cursor:not-allowed}.node.boss{width:150px;min-height:120px;border-radius:50% 50% 40% 40%;background:linear-gradient(180deg,var(--surface),#3a1430);border-color:#a33}.node.boss .node-ic{width:60px;height:60px;font-size:1.6em;background:#7b1e3a;color:#fff;border-color:#f66}
.node.check{border-style:dashed}.node.play{border-color:var(--primary)}
.node-mascot{position:absolute;top:-30px;right:-8px;animation:bob 1.4s infinite ease-in-out}@keyframes bob{50%{transform:translateY(-4px)}}
.prof-top{display:flex;gap:12px;align-items:center}.prof-name{font-weight:800;font-size:1.15em}.prof-title{color:var(--primary);font-weight:600;font-size:.9em}.prof-lv{color:var(--muted);font-size:.85em}
.prof-row{display:flex;justify-content:space-between;font-size:.9em;color:var(--muted);margin:4px 0 8px}.prof-btns{display:flex;flex-wrap:wrap;gap:6px}
.goalbar{height:12px;background:var(--surface2);border-radius:999px;overflow:hidden;margin:6px 0}.goalbar div{height:100%;background:var(--gold);transition:width .5s}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal-cell{aspect-ratio:1;border-radius:4px;background:var(--surface2)}.cal-cell.l1{background:#2a5a3a}.cal-cell.l2{background:#2f8a4e}.cal-cell.l3{background:#36b85f}.cal-cell.l4{background:#4ef07a}
/* 레슨 */
.lesson{max-width:860px;margin:0 auto}.lp-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.dots{display:flex;gap:5px}.dots span{width:10px;height:10px;border-radius:50%;background:var(--border)}.dots span.past{background:var(--accent)}.dots span.on{background:var(--primary);transform:scale(1.3)}
.lp-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:12px;animation:pop .25s}
.lp-html p{margin:.5em 0}.lp-html ul{padding-left:1.2em}
.uibtn{display:inline-block;padding:2px 10px;margin:0 2px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-weight:700;font-size:.92em;line-height:1.5;box-shadow:0 2px 0 rgba(0,0,0,.25);vertical-align:baseline;white-space:nowrap}.uibtn.primary{background:var(--primary);border-color:transparent;color:#fff}.uibtn.accent{background:var(--accent);border-color:transparent;color:#fff}.uibtn.tutor{background:linear-gradient(135deg,#8e6cff,#5b8def);border-color:transparent;color:#fff}
dfn.term{font-style:normal;font-weight:800;font-size:1.12em;text-decoration:underline dotted var(--primary);text-decoration-thickness:2px;text-underline-offset:4px;cursor:help;color:var(--primary);padding:0 2px}
.term-pop{position:absolute;z-index:500;background:var(--surface);border:1px solid var(--primary);border-radius:10px;padding:8px 12px;max-width:270px;box-shadow:var(--shadow);font-size:.9em;animation:pop .2s}
.ex{margin-top:14px;border-top:1px dashed var(--border);padding-top:12px}.ex-h{font-weight:700;margin-bottom:6px}
.lp-nav{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
.summary{padding-left:1.2em}.summary li{margin:4px 0}
.plist{display:flex;flex-direction:column;gap:6px}
.pitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);text-align:left}.pitem:hover{filter:brightness(1.08)}.pitem.clear{border-color:var(--accent)}.pitem.try{border-color:var(--warn)}
.pnum{width:26px;height:26px;border-radius:50%;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.85em;flex-shrink:0}.ptype{font-size:.75em;color:var(--muted);flex-shrink:0}.ptitle{flex:1}.pxp{color:var(--gold);font-size:.85em}
/* 에디터 */
.ted{min-height:200px;height:280px;resize:vertical;overflow:hidden;border:1px solid var(--border);border-radius:10px;background:var(--ed-bg)}
.ted-cm,.ted-fb{height:100%}.ted-fb{display:flex}.ted-gutter{width:40px;padding:8px 6px;text-align:right;color:var(--ed-com);background:var(--ed-bg);border-right:1px solid rgba(128,128,128,.2);overflow:hidden;font-size:var(--code-size);line-height:1.5;user-select:none}
.ted-ta{flex:1;padding:8px;border:0;outline:0;resize:none;background:var(--ed-bg);color:var(--ed-fg);font-family:var(--mono);font-size:var(--code-size);line-height:1.5;tab-size:4}
.cm-editor{height:100%}.cm-scroller{overflow:auto!important}
.cm-ind-1{--w:4ch}.cm-ind-2{--w:8ch}.cm-ind-3{--w:12ch}.cm-ind-4{--w:16ch}.cm-ind-5{--w:20ch}.cm-ind-6{--w:24ch}.cm-ind-7{--w:28ch}.cm-ind-8{--w:32ch}
.cm-line.cm-ind{background-image:repeating-linear-gradient(to right,rgba(128,128,128,.4) 0 1px,transparent 1px 4ch);background-size:var(--w) 100%;background-position:6px 0}
.ed-wrap{position:relative}
.stdin{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);color:var(--text);font-size:var(--code-size);resize:vertical}
.out{min-height:60px;max-height:320px;overflow:auto;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--ed-bg);color:var(--ed-fg);font-size:var(--code-size);line-height:1.5}.out.haserr{border-color:var(--danger)}
.errbox{margin-top:8px;padding:8px 10px;border-left:3px solid var(--danger);background:rgba(255,93,108,.12);border-radius:6px;font-family:var(--sans);font-size:.95em}.errko{color:var(--warn)}
.code{padding:10px 12px;border-radius:8px;background:var(--ed-bg);color:var(--ed-fg);font-size:var(--code-size);line-height:1.55;overflow:auto}.code.bad{border-left:3px solid var(--danger)}.code.good{border-left:3px solid var(--accent)}
.pv-run{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.turtle-c{max-width:100%;border-radius:8px;border:1px solid var(--border);background:var(--surface2);margin-top:8px}
#quickkeys{position:fixed;left:0;right:0;bottom:0;z-index:200;display:none;gap:4px;padding:6px;background:var(--surface);border-top:1px solid var(--border);overflow-x:auto;white-space:nowrap}#quickkeys.show{display:flex}#quickkeys button{min-width:44px;min-height:44px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:var(--mono);flex-shrink:0}
/* 블록 */
.block-wrap{display:grid;grid-template-columns:1fr 250px;gap:10px}.bed{position:relative;height:min(600px,calc(100vh - 230px));min-height:420px;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface2)}.bed-ws{width:100%;height:100%}.bed-loading{padding:20px;color:var(--muted)}
.bed-guide{position:absolute;left:46%;right:14px;top:50%;transform:translateY(-50%);pointer-events:none;text-align:center;color:#334;background:rgba(255,255,255,.92);border:2px dashed var(--primary);border-radius:14px;padding:14px 12px;font-size:1.02em;line-height:1.5;box-shadow:0 6px 20px rgba(0,0,0,.12);transition:opacity .25s}.bed-guide.hide{opacity:0}
.bed-guide .bg-arrow{font-size:2em;line-height:1;color:var(--primary);animation:bgnudge 1.1s ease-in-out infinite}.bed-guide .bg-t b{color:var(--primary)}.bed-guide .bg-s{margin-top:6px;font-size:.86em;color:#667}
.bed.single .bed-guide{left:50%}.bed.horiz .bed-guide{left:14px;right:14px;top:34%;transform:none}.bed.horiz .bg-arrow{animation-name:bgnudgev}
@keyframes bgnudge{0%,100%{transform:translateX(0)}50%{transform:translateX(-10px)}}@keyframes bgnudgev{0%,100%{transform:translateY(0)}50%{transform:translateY(10px)}}
.codeview{min-width:0}.codeview .code{height:calc(100% - 26px);min-height:300px;overflow:auto;padding:8px}.cvl{padding:0 6px;border-radius:4px;cursor:pointer;white-space:pre}.cvl.hl{background:rgba(80,160,255,.3)}
.blocklyToolboxDiv{background:var(--surface)!important;color:var(--text);padding:6px 4px!important}.blocklyTreeLabel{color:var(--text)!important;font-weight:800;font-size:1.05em}.blocklyFlyoutBackground{fill:var(--surface2)!important}
.bed:not(.horiz) .blocklyToolboxContents::before{content:'블록 메뉴\A눌러서 열기 ▾';white-space:pre;display:block;text-align:center;font-size:.72em;color:var(--muted);padding:4px 0 8px;line-height:1.35}
.bed:not(.horiz) .blocklyToolboxCategory{margin:3px 0}.bed:not(.horiz) .blocklyTreeRow{display:flex;align-items:center;justify-content:center;gap:4px;height:auto!important;padding:10px 8px!important;margin:0!important;border-radius:10px;border:1.5px solid var(--border);background:var(--surface2);cursor:pointer;transition:transform .12s}.bed:not(.horiz) .blocklyTreeRow:hover{transform:translateX(2px)}
.bed:not(.horiz) .blocklyTreeRow::after{content:'▸';font-weight:900;color:var(--muted)}.bed:not(.horiz) .blocklyTreeSelected::after{content:'◂';color:#fff}.bed:not(.horiz) .blocklyTreeSelected .blocklyTreeLabel{color:#fff!important}
.blocklyFlyoutLabelText{fill:var(--text)!important;font-weight:800;font-size:.95em}
/* Parsons */
.parsons{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pz-col{min-width:0}.pz-head{font-weight:700;font-size:.9em;margin-bottom:6px}.pz-head small{color:var(--muted);font-weight:normal}
.pz-list{min-height:120px;border:1px dashed var(--border);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:5px;background:var(--surface2)}.pz-empty{color:var(--muted);font-size:.85em;padding:8px}
.pz-tile{display:flex;align-items:center;gap:4px;padding:6px 8px;border-radius:8px;background:var(--surface);border:1px solid var(--border);cursor:pointer;user-select:none;touch-action:none;transition:transform .1s}.pz-tile code{flex:1;font-size:var(--code-size);white-space:pre}.pz-bank .pz-tile:hover{border-color:var(--primary)}
.pz-ans{cursor:default;padding-left:calc(8px + var(--ind,0)*0px)}.pz-ind{color:var(--muted);font-family:var(--mono);white-space:pre}.pz-grip{cursor:grab;color:var(--muted);padding:0 4px;font-size:1.1em;touch-action:none}.pz-b{min-width:28px;min-height:28px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:.75em;padding:0}.pz-x{color:var(--danger)}
.pz-ans.wrong{border-color:var(--danger);background:rgba(255,93,108,.15);animation:shake .4s}.pz-ans.over{border-color:var(--primary);border-style:dashed}.pz-ans.dragging{opacity:.4}.pz-ghost{position:fixed;z-index:999;pointer-events:none;opacity:.9;box-shadow:var(--shadow)}
/* 문제 */
.pv{display:grid;grid-template-columns:minmax(280px,32%) 1fr;gap:16px}#view.view-problem{max-width:1720px}.pv.mode-block{grid-template-columns:minmax(250px,24%) 1fr}.pv-tabs{display:none}
.pv-head{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}.pv-title{margin:4px 0 8px}.pv-prompt{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;line-height:1.6}.pv-prompt code,.lp-html code,.quiz code,.tutor-panel code,.result code{background:var(--surface2);padding:1px 5px;border-radius:4px;font-size:.92em}.pv-prompt pre{background:var(--ed-bg);color:var(--ed-fg);padding:8px;border-radius:6px;margin:6px 0}.pv-prompt ul{padding-left:1.2em}
.pv-inex{margin-top:8px;font-size:.9em}.pv-inex pre{background:var(--surface2);padding:6px 8px;border-radius:6px;margin-top:4px}

/*
문제 데이터 스키마 (PROBLEMS 배열의 원소)
  id        string  필수. 고유 id. 예: 'L1P1'  (레슨 L1의 1번 문제)
  lesson    string  필수. 소속 레슨 id ('L0'..'L18', 보스는 'B1'..'B5')
  type      string  필수. 'quiz' | 'fill' | 'bug' | 'parsons' | 'block' | 'code'
  title     string  필수. 문제 제목
  prompt    string  필수. 지문 (HTML 허용, <code> 사용 가능)
  tags      string[] 필수. 개념 태그 1~3개 ('출력','변수','계산','조건','반복','리스트','함수','문자열','딕셔너리','클래스','예외','파일','모듈','오개념')
  hints     string[3] 필수. 힌트 3단계 (방향 → 구체 → 거의 정답)
  xp        number  선택. 생략 시 CONFIG.XP[type]
  boss      bool    선택. 보스 문제(HP 바 연출, 테스트 5개 이상)
  project   {steps:string[]} 선택. 미니 프로젝트 체크리스트. 클리어 시 "내 작품"에 저장
  dual      bool    선택. Parsons/텍스트 선택 가능 (텍스트로 풀면 XP 1.5배)
  vary      object  선택. 복습 변형 파라미터. 예: {n:[2,9]} (정수 범위) 또는 {w:['사과','배']} (목록)
                    prompt/starter/solution/tests 안의 {{n}} 이 치환되고 기대 출력은 정답 코드를 실행해 계산
  --- type별 필드 ---
  quiz:    quiz:{opts:string[4], ans:number(0~3), why:string}
  fill:    fill:{code:string('___1___' 자리), blanks:[{a:string[], opt?:string[]}], why:string}
  bug:     bug:{code:string, bugLine:number(1부터), solution:string, tests:TEST[]}
  parsons: parsons:{solution:string, distractors?:string[]}
  block:   starter?:string, solution:string, tests:TEST[], inputExample?:string
  code:    starter?:string, solution:string, tests:TEST[], inputExample?:string, turtle?:bool, ignoreCase?:bool
  TEST = {input?:string(줄바꿈으로 여러 줄), output:string} | {call:string, ret:string(repr)}
  마지막 테스트 1개는 화면에 숨김(하드코딩 방지). 거북이 문제(turtle:true)는 정답 코드의 선분 목록과 비교.

예시:
  { id:'L1P1', lesson:'L1', type:'block', title:'첫 인사', prompt:'<code>안녕, 파이썬!</code>을 출력하세요.',

    solution:'print("안녕, 파이썬!")', tests:[{output:'안녕, 파이썬!'}] }

레슨 데이터 스키마 (LESSONS 배열)
  id, ch(챕터 번호), n(레슨 번호; 보스는 없음), title, minutes, mode('read'|'block'|'parsons'|'text'),
  boss(bool), blocks(string[] 이 레슨에서 새로 열리는 블록; 누적됨), tutorSummary, terms(object 용어→설명),
  pages:[{title, html, example?:{code, trace?:bool}}], summary:string[3]
*/

    { title:'나머지와 몫', html:`<p>나누기 <code>/</code>는 결과가 항상 소수예요. <code>7 / 2</code>는 3.5이고, <code>8 / 2</code>도 4가 아니라 <b>4.0</b>이 나와요.</p><p>정수로 된 <b>몫</b>만 원하면 <code>//</code>, <b>나머지</b>만 원하면 <code>%</code>를 써요. 나머지는 짝수·홀수를 구분할 때 아주 자주 써요. <code>n % 2</code>가 0이면 짝수예요.</p>`,
      example:{ code:`print(7 / 2)\nprint(7 // 2)\nprint(7 % 2)\nprint(8 / 2)` } },
    { title:'input: 사용자에게 묻기', html:`<p>[[input]]은 사용자가 키보드로 적은 것을 받아 와요. <code>name = input()</code>처럼 변수에 담아 쓰죠. 이 앱에서는 에디터 아래 <b>입력값 칸</b>에 미리 적어 둔 내용을 한 줄씩 읽어요.</p><p>중요한 점: input이 돌려주는 값은 <b>항상 글자(문자열)</b>예요. "7"을 입력해도 글자 "7"이에요. 숫자로 계산하려면 <code>int()</code>로 바꿔 줘야 해요. 이걸 [[형 변환]]이라고 해요.</p>`,
      example:{ code:`n = input()\nprint(n + n)\nm = int(n)\nprint(m + m)`, stdin:'7' } },
  ],
  summary:['+ - * / 와 나머지 %, 몫 //','input()은 항상 문자열을 돌려준다','숫자로 쓰려면 int()로 바꾼다'] },

{ id:'L4', ch:1, n:4, title:'조건문: 만약에', minutes:15, mode:'block', blocks:['controls_if','logic_compare','logic_operation','logic_negate','logic_boolean'],
  tutorSummary:'if 조건: 으로 조건이 참일 때만 실행. elif로 다른 조건, else로 나머지. 비교는 == != < > <= >=, 논리는 and or not. 콜론 뒤 줄은 들여쓰기.',
  terms:{ '조건문':'조건이 맞을 때만 어떤 코드를 실행하게 하는 문장 (if)', '들여쓰기':'줄 앞에 공백 4칸을 넣어 "이 줄은 위 문장에 속한다"고 표시하는 것' },
  pages:[
    { title:'만약 ~라면', html:`<p>[[조건문]] <code>if</code>는 "만약 ~라면 이걸 해라"예요. <code>if 조건:</code> 다음 줄부터 <b>공백 4칸 들여쓴 줄</b>이 조건이 참일 때 실행돼요.</p><p>이 [[들여쓰기]]가 파이썬의 핵심 규칙이에요. 들여쓴 줄은 if에 속하고, 들여쓰기를 되돌리면 if 밖이에요. 콜론 <code>:</code>을 빠뜨리면 에러가 나요.</p>`,
      example:{ code:`age = 15\nif age >= 13:\n    print("청소년이에요")\nprint("이 줄은 항상 나와요")` } },
    { title:'아니면 (elif, else)', html:`<p>조건이 거짓일 때 할 일은 <code>else:</code>에 써요. 조건이 여러 개면 중간에 <code>elif 조건:</code>을 넣어요. 위에서부터 검사해서 <b>처음 맞는 하나만</b> 실행돼요.</p>`,
      example:{ code:`score = 85\nif score >= 90:\n    print("A")\nelif score >= 80:\n    print("B")\nelse:\n    print("C")` } },
    { title:'비교와 논리', html:`<p>비교할 때는 <code>== != &lt; &gt; &lt;= &gt;=</code>를 써요. <b>같다는 <code>==</code> (등호 두 개)</b>예요. 등호 하나 <code>=</code>는 변수에 넣는 것이었죠.</p><p>조건 두 개를 묶을 땐 <code>and</code>(둘 다), <code>or</code>(하나라도), 뒤집을 땐 <code>not</code>을 써요.</p>`,
      example:{ code:`x = 7\nprint(x == 7)\nprint(x > 10)\nprint(x > 0 and x < 10)\nprint(not x == 7)` } },
  ],
  summary:['if 조건: 아래 들여쓴 줄이 참일 때 실행','elif / else 로 갈래를 나눈다','같다는 == (두 개), 넣기는 = (한 개)'] },

{ id:'B1', ch:1, boss:true, title:'보스: 숫자 맞히기 1단계', minutes:10, mode:'block', pages:[], summary:[],
  tutorSummary:'input으로 받은 수를 int로 바꾸고, 비밀 숫자 7과 비교해 정답/더 커요/더 작아요를 출력하는 조건 분기 종합.' },

{ id:'L5', ch:2, n:5, title:'for와 range: 반복하기', minutes:15, mode:'block', blocks:['py_for_range','controls_repeat_ext'],
  tutorSummary:'for i in range(n): 은 n번 반복하며 i가 0부터 n-1까지 변한다. range(a,b)는 a부터 b-1, range(a,b,step)은 step씩. 반복 안의 코드는 들여쓴다.',
  terms:{ '반복문':'같은 일을 여러 번 되풀이하게 하는 문장 (for, while)', 'range':'연속된 숫자를 만들어 주는 것. range(5)는 0,1,2,3,4' },
  pages:[
    { title:'같은 일을 여러 번', html:`<p>"안녕"을 100번 출력하려고 print를 100줄 쓰면 손이 아프죠. [[반복문]] <code>for</code>를 쓰면 한 번만 써도 돼요.</p><p><code>for i in range(3):</code>은 "i를 0, 1, 2로 바꿔 가며 아래 들여쓴 줄을 3번 실행해라"예요. i는 반복 때마다 바뀌는 변수예요.</p>`,
      example:{ code:`for i in range(3):\n    print("안녕", i)`, trace:true } },
    { title:'range 자세히', html:`<p><code>range(5)</code>는 0, 1, 2, 3, 4예요. <b>5는 들어가지 않아요!</b> 0부터 시작해서 5 바로 앞에서 끝나요. 이걸 헷갈려서 생기는 버그가 정말 많아요.</p><p><code>range(1, 6)</code>은 1부터 5까지, <code>range(0, 10, 2)</code>는 0부터 2씩 뛰어 8까지예요. 세 번째 값이 "몇 칸씩 뛸지"예요.</p>`,
      example:{ code:`for i in range(5):\n    print(i)\nprint("---")\nfor i in range(1, 6):\n    print(i)\nprint("---")\nfor i in range(0, 10, 2):\n    print(i)` } },
    { title:'거북이에게 명령하기', html:`<p><code>import turtle</code>을 쓰면 화면에 거북이가 나타나요. <code>turtle.forward(100)</code>은 앞으로 100만큼 가고, <code>turtle.left(90)</code>은 왼쪽으로 90도 돌아요. 펜을 들고 가니까 지나간 자리에 선이 남죠.</p><p>정사각형은 "앞으로 가고 90도 돌기"를 4번 하면 돼요. 반복문이 딱이죠?</p>`,
      example:{ code:`import turtle\nfor i in range(4):\n    turtle.forward(100)\n    turtle.left(90)` } },
  ],
  summary:['for i in range(n): 은 n번 반복','range(5)는 0~4, 5는 없다','range(시작, 끝, 간격)'] },

{ id:'L6', ch:2, n:6, title:'while: 조건 반복', minutes:15, mode:'block', blocks:['controls_whileUntil','controls_flow_statements'],
  tutorSummary:'while 조건: 은 조건이 참인 동안 반복. 안에서 조건이 바뀌지 않으면 무한루프. break로 즉시 탈출, continue로 다음 반복으로 건너뜀.',
  terms:{ '무한루프':'끝나는 조건이 없어서 영원히 도는 반복. 보통 조건을 바꾸는 줄을 깜빡해서 생긴다' },
  pages:[
    { title:'~하는 동안 반복', html:`<p><code>for</code>는 횟수가 정해졌을 때, <code>while</code>은 <b>"조건이 참인 동안"</b> 계속 반복할 때 써요. 몇 번 돌지 모를 때 좋아요.</p><p><code>while n &lt; 3:</code>은 n이 3보다 작은 동안 반복해요. 반복 안에서 n을 키워야 언젠가 조건이 거짓이 되어 멈춰요.</p>`,
      example:{ code:`n = 0\nwhile n < 3:\n    print("n은", n)\n    n = n + 1\nprint("끝")`, trace:true } },
    { title:'무한루프 탈출', html:`<p>반복 안에서 조건을 바꾸는 줄을 깜빡하면 영원히 돌아요. 이게 [[무한루프]]예요. 이 앱은 5초가 지나면 강제로 멈추고 알려 줘요.</p><p>일부러 <code>while True:</code>로 무한히 돌게 한 뒤 <code>break</code>로 빠져나오는 방법도 자주 써요. "끝"이라고 입력할 때까지 받는 프로그램이 그 예예요.</p>`,
      example:{ code:`while True:\n    word = input()\n    if word == "끝":\n        break\n    print("입력:", word)\nprint("종료")`, stdin:'사과\n배\n끝' } },
    { title:'continue', html:`<p><code>continue</code>는 "이번 회차는 여기서 그만하고 다음 회차로 넘어가라"예요. 홀수만 건너뛰고 짝수만 출력할 때 이렇게 써요.</p>`,
      example:{ code:`for i in range(6):\n    if i % 2 == 1:\n        continue\n    print(i)` } },
  ],
  summary:['while 조건: 은 조건이 참인 동안 반복','조건을 바꾸지 않으면 무한루프','break는 탈출, continue는 다음 회차로'] },

{ id:'L7', ch:2, n:7, title:'리스트: 여러 개를 한 줄로', minutes:15, mode:'block', blocks:['lists_create_with','lists_length','py_index','py_append','py_pop','controls_forEach'],
  tutorSummary:'리스트는 [a, b, c]처럼 여러 값을 순서대로 담는 상자. 인덱스는 0부터. append로 끝에 추가, pop으로 꺼내기, len으로 개수. for x in 리스트: 로 하나씩 꺼낸다.',
  terms:{ '리스트':'여러 값을 순서대로 담는 묶음. 대괄호 [ ]로 만든다', '인덱스':'리스트 안에서의 번호. 0부터 시작한다' },
  pages:[
    { title:'줄줄이 담기', html:`<p>과일 세 개를 변수 세 개에 담으면 번거롭죠. [[리스트]]는 <b>여러 값을 한 줄로 담는 상자</b>예요. 대괄호 안에 쉼표로 나열해요.</p><p>리스트 안의 각 값은 번호가 있어요. 이걸 [[인덱스]]라고 하는데, <b>0부터 시작</b>해요. 첫 번째가 0, 두 번째가 1이에요. 마지막은 -1로도 꺼낼 수 있어요.</p>`,
      example:{ code:`fruits = ["사과", "배", "포도"]\nprint(fruits[0])\nprint(fruits[2])\nprint(fruits[-1])` } },
    { title:'추가하고 꺼내기', html:`<p><code>리스트.append(값)</code>은 끝에 값을 붙여요. <code>리스트.pop()</code>은 마지막 값을 꺼내서 돌려주고 리스트에서 지워요. <code>len(리스트)</code>는 몇 개 들어 있는지 알려 줘요.</p>`,
      example:{ code:`nums = [1, 2]\nnums.append(3)\nprint(nums)\nlast = nums.pop()\nprint(last)\nprint(nums)\nprint(len(nums))`, trace:true } },
    { title:'리스트 하나씩 돌기', html:`<p><code>for x in 리스트:</code>는 리스트의 값을 앞에서부터 하나씩 x에 담으며 반복해요. range 없이 바로 쓸 수 있어서 편해요.</p><p>리스트 값은 <code>리스트[번호] = 새값</code>으로 바꿀 수 있어요.</p>`,
      example:{ code:`animals = ["개", "고양이", "토끼"]\nfor a in animals:\n    print(a, "좋아")\nanimals[1] = "햄스터"\nprint(animals)` } },
  ],
  summary:['리스트 = [값, 값, 값], 인덱스는 0부터','append로 추가, pop으로 꺼내기, len으로 개수','for x in 리스트: 로 하나씩'] },

{ id:'L8', ch:2, n:8, title:'함수: 레시피 만들기', minutes:18, mode:'block', blocks:['procedures_defnoreturn','procedures_defreturn','procedures_callnoreturn','procedures_callreturn','procedures_ifreturn'],
  tutorSummary:'def 이름(매개변수): 로 함수를 정의하고 이름()으로 호출. return으로 값을 돌려준다. return 뒤의 코드는 실행되지 않는다. return이 없으면 None.',
  terms:{ '함수':'여러 줄의 코드에 이름을 붙여 묶어 둔 것. 이름만 부르면 그 코드가 실행된다', '매개변수':'함수를 부를 때 넘겨 주는 재료를 받는 변수 (parameter)', 'return':'함수가 계산한 결과를 부른 쪽에 돌려주는 것' },
  pages:[
    { title:'코드에 이름 붙이기', html:`<p>[[함수]]는 <b>레시피</b>예요. "라면 끓이기" 레시피를 한 번 써 두면, 다음부터는 "라면 끓이기!"라고 부르기만 하면 되죠.</p><p><code>def 이름():</code>으로 레시피를 쓰고(정의), <code>이름()</code>으로 불러요(호출). 정의만 하면 아무 일도 안 일어나요. <b>불러야</b> 실행돼요.</p>`,
      example:{ code:`def hello():\n    print("안녕하세요!")\n    print("반가워요")\n\nhello()\nhello()` } },
    { title:'재료 넘기기', html:`<p>괄호 안에 [[매개변수]]를 두면 부를 때마다 다른 재료를 넘길 수 있어요. <code>def greet(name):</code>에서 name이 매개변수예요. <code>greet("민수")</code>라고 부르면 name에 "민수"가 들어가요.</p>`,
      example:{ code:`def greet(name, times):\n    for i in range(times):\n        print(name, "안녕!")\n\ngreet("민수", 2)\ngreet("영희", 1)`, trace:true } },
    { title:'결과 돌려주기', html:`<p>[[return]]은 함수가 계산한 <b>결과를 돌려주는 것</b>이에요. <code>result = add(2, 3)</code>처럼 돌려받은 값을 변수에 담아요.</p><p>주의! <b>return을 만나면 함수는 그 자리에서 끝나요.</b> return 아래 줄은 실행되지 않아요. return이 없는 함수는 <code>None</code>(아무것도 없음)을 돌려줘요.</p>`,
      example:{ code:`def add(a, b):\n    return a + b\n    print("이 줄은 절대 실행 안 돼요")\n\nresult = add(2, 3)\nprint(result)\nprint(add(10, 20))` } },
  ],
  summary:['def 이름(): 으로 정의, 이름()으로 호출','매개변수로 재료를 받는다','return은 결과를 돌려주고 함수를 끝낸다'] },

{ id:'B2', ch:2, boss:true, title:'보스: 숫자 맞히기 게임 완성', minutes:15, mode:'parsons', pages:[], summary:[],
  tutorSummary:'미니 프로젝트 1. while 반복, 조건문, 시도 횟수 변수, 입력 형 변환을 합쳐 숫자 맞히기 게임을 완성한다.' },
];
LESSONS.push(
{ id:'L9', ch:3, n:9, title:'문자열 다루기', minutes:15, mode:'parsons',
  tutorSummary:'문자열 인덱스·슬라이싱 s[a:b], len, upper/lower/replace/split/strip 메서드, f-string f"{변수}"로 값 끼워 넣기.',
  terms:{ '슬라이싱':'문자열이나 리스트의 일부를 [시작:끝]으로 잘라내는 것', '메서드':'값에 점(.)을 찍고 부르는 함수. "abc".upper() 처럼', 'f-string':'앞에 f를 붙인 문자열. 중괄호 { } 안에 변수를 넣으면 값이 끼워진다' },
  pages:[
    { title:'글자도 번호가 있어요', html:`<p>문자열도 리스트처럼 글자마다 인덱스가 있어요. <code>s[0]</code>은 첫 글자예요. <code>s[1:4]</code>처럼 쓰면 1번부터 <b>4번 앞까지</b> 잘라 와요. 이걸 [[슬라이싱]]이라고 해요.</p><p>시작을 비우면 처음부터, 끝을 비우면 끝까지예요. <code>s[::-1]</code>은 거꾸로 뒤집기라는 유명한 꼼수예요.</p>`,
      example:{ code:`s = "python"\nprint(s[0])\nprint(s[1:4])\nprint(s[:2])\nprint(s[2:])\nprint(s[::-1])\nprint(len(s))` } },
    { title:'문자열 메서드', html:`<p>문자열 뒤에 점을 찍고 부르는 기능을 [[메서드]]라고 해요. <code>upper()</code> 대문자로, <code>lower()</code> 소문자로, <code>replace(a, b)</code> a를 b로 바꾸기, <code>split()</code> 띄어쓰기 기준으로 잘라 리스트로, <code>strip()</code> 양끝 공백 제거.</p><p>메서드는 원래 문자열을 바꾸지 않고 <b>새 문자열을 돌려줘요</b>.</p>`,
      example:{ code:`s = "hello world"\nprint(s.upper())\nprint(s.replace("world", "python"))\nwords = s.split()\nprint(words)\nprint(len(words))\nprint("  공백  ".strip())` } },
    { title:'f-string: 값 끼워 넣기', html:`<p>"민수님, 12살이시군요"처럼 변수를 문장에 끼우려면 [[f-string]]이 제일 편해요. 따옴표 앞에 <code>f</code>를 붙이고 중괄호 안에 변수나 계산식을 넣어요.</p>`,
      example:{ code:`name = "민수"\nage = 12\nprint(f"{name}님, {age}살이시군요")\nprint(f"내년엔 {age + 1}살")` } },
  ],
  summary:['s[a:b]로 자르기, s[::-1]로 뒤집기','upper, replace, split, strip 메서드','f"{변수}" 로 값 끼워 넣기'] },

{ id:'L10', ch:3, n:10, title:'딕셔너리: 이름으로 찾기', minutes:15, mode:'parsons',
  tutorSummary:'딕셔너리 {키: 값}. d[키]로 꺼내고 d[키] = 값으로 추가·수정. 없는 키는 KeyError, d.get(키, 기본값)은 안전. for k, v in d.items(): 로 반복. in으로 키 존재 확인.',
  terms:{ '딕셔너리':'키(이름)로 값을 찾는 묶음. 중괄호 {키: 값}으로 만든다', '키':'딕셔너리에서 값을 찾을 때 쓰는 이름표' },
  pages:[
    { title:'번호 대신 이름으로', html:`<p>리스트는 번호로 찾지만 [[딕셔너리]]는 <b>이름([[키]])으로</b> 찾아요. 진짜 사전처럼요. 중괄호 안에 <code>키: 값</code> 쌍을 나열해요.</p><p><code>d["사과"]</code>처럼 꺼내요. 없는 키를 꺼내면 <code>KeyError</code>가 나요. <code>d.get("키", 0)</code>을 쓰면 없을 때 0을 돌려줘서 안전해요.</p>`,
      example:{ code:`price = {"사과": 1000, "배": 2000}\nprint(price["사과"])\nprint(price.get("포도", 0))\nprint("배" in price)` } },
    { title:'추가·수정·삭제', html:`<p><code>d[키] = 값</code>은 키가 없으면 추가, 있으면 수정이에요. <code>del d[키]</code>로 지워요. <code>len(d)</code>는 쌍의 개수예요.</p>`,
      example:{ code:`d = {}\nd["민수"] = 90\nd["영희"] = 85\nd["민수"] = 95\nprint(d)\ndel d["영희"]\nprint(d, len(d))`, trace:true } },
    { title:'딕셔너리 반복', html:`<p><code>for k in d:</code>는 키만 돌아요. 키와 값을 같이 보려면 <code>for k, v in d.items():</code>를 써요. 단어 개수 세기처럼 "없으면 0에서 시작해 1 더하기" 패턴이 매우 자주 나와요.</p>`,
      example:{ code:`count = {}\nfor w in ["a", "b", "a"]:\n    count[w] = count.get(w, 0) + 1\nfor k, v in count.items():\n    print(k, v)` } },
  ],
  summary:['{키: 값}, d[키]로 찾고 d[키] = 값으로 넣기','없는 키는 KeyError, get(키, 기본값)은 안전','for k, v in d.items(): 로 반복'] },

{ id:'L11', ch:3, n:11, title:'튜플·집합·컴프리헨션', minutes:15, mode:'text',
  tutorSummary:'튜플 (a, b)는 바꿀 수 없는 리스트. 집합 {a, b}는 중복 없고 순서 없음, set()으로 중복 제거. 리스트 컴프리헨션 [식 for x in 목록 if 조건]으로 한 줄에 리스트 만들기.',
  terms:{ '튜플':'한 번 만들면 바꿀 수 없는 리스트. 소괄호 ( )', '집합':'중복이 없고 순서도 없는 묶음. set', '컴프리헨션':'[식 for 변수 in 목록] 처럼 한 줄로 리스트를 만드는 문법' },
  pages:[
    { title:'튜플: 못 바꾸는 리스트', html:`<p>[[튜플]]은 소괄호로 만드는 리스트인데 <b>한 번 만들면 못 바꿔요</b>. 바꾸려 하면 <code>TypeError</code>가 나요. 좌표 (x, y)처럼 묶음이 고정일 때 써요. <code>a, b = b, a</code>로 두 변수를 맞바꾸는 꼼수도 튜플 덕분이에요.</p>`,
      example:{ code:`point = (3, 4)\nprint(point[0])\na, b = 1, 2\na, b = b, a\nprint(a, b)` } },
    { title:'집합: 중복 제거', html:`<p>[[집합]]은 <b>같은 값이 두 번 들어갈 수 없어요</b>. 리스트를 <code>set()</code>에 넣으면 중복이 사라져요. 순서는 보장되지 않으니 보기 좋게 하려면 <code>sorted()</code>로 정렬해요.</p>`,
      example:{ code:`nums = [3, 1, 3, 2, 1]\ns = set(nums)\nprint(len(s))\nprint(sorted(s))\nprint(2 in s)` } },
    { title:'한 줄로 리스트 만들기', html:`<p>"1부터 5까지 제곱한 리스트"를 for와 append로 만들면 4줄인데, [[컴프리헨션]]을 쓰면 한 줄이에요. <code>[x * x for x in range(1, 6)]</code>. 뒤에 <code>if</code>를 붙이면 골라 담아요.</p>`,
      example:{ code:`squares = [x * x for x in range(1, 6)]\nprint(squares)\nevens = [x for x in range(10) if x % 2 == 0]\nprint(evens)` } },
  ],
  summary:['튜플 (a, b)는 바꿀 수 없다','set()으로 중복 제거','[식 for x in 목록 if 조건]'] },

{ id:'L12', ch:3, n:12, title:'중첩 구조', minutes:18, mode:'text',
  tutorSummary:'리스트 안의 딕셔너리 [{"name":..}, ...], 2차원 리스트 [[1,2],[3,4]]. 바깥 인덱스 먼저, 안쪽 인덱스 다음: grid[1][0]. 중첩 for로 모두 돈다. 리스트 대입은 복사가 아니라 같은 상자를 가리킨다.',
  pages:[
    { title:'상자 안의 상자', html:`<p>리스트 안에 딕셔너리를 넣으면 "학생 명단" 같은 표를 만들 수 있어요. <code>students[0]</code>은 첫 학생(딕셔너리), <code>students[0]["name"]</code>은 그 학생의 이름이에요. <b>바깥부터 안쪽으로</b> 차례로 꺼내요.</p>`,
      example:{ code:`students = [\n    {"name": "민수", "score": 90},\n    {"name": "영희", "score": 85},\n]\nprint(students[1]["name"])\nfor s in students:\n    print(s["name"], s["score"])` } },
    { title:'2차원 리스트', html:`<p>리스트 안에 리스트를 넣으면 표(행과 열)가 돼요. <code>grid[1][0]</code>은 1번 행의 0번 열이에요. 모든 칸을 돌려면 for 안에 for를 넣어요(중첩 반복).</p>`,
      example:{ code:`grid = [[1, 2, 3], [4, 5, 6]]\nprint(grid[1][0])\nfor row in grid:\n    for v in row:\n        print(v, end=" ")\n    print()`, trace:true } },
    { title:'복사의 함정', html:`<p><code>b = a</code>는 리스트를 복사하는 게 아니라 <b>같은 상자에 이름표를 하나 더 붙이는 것</b>이에요. b를 바꾸면 a도 바뀌어요! 따로 복사하려면 <code>b = a.copy()</code> 또는 <code>b = list(a)</code>를 써요.</p>`,
      example:{ code:`a = [1, 2, 3]\nb = a\nb.append(4)\nprint(a)\nc = a.copy()\nc.append(5)\nprint(a)\nprint(c)` } },
  ],
  summary:['students[0]["name"] 처럼 바깥부터 안쪽으로','2차원 리스트 grid[행][열], 중첩 for','b = a 는 복사가 아니다, copy()를 쓴다'] },

{ id:'B3', ch:3, boss:true, title:'보스: 간단한 가계부', minutes:20, mode:'text', pages:[], summary:[],
  tutorSummary:'미니 프로젝트 2. 명령을 입력받아 딕셔너리에 항목별 금액을 누적하고 합계·검색을 출력하는 프로그램. split, 딕셔너리 get, while/break 종합.' },

{ id:'L13', ch:4, n:13, title:'예외 처리', minutes:15, mode:'text',
  tutorSummary:'try: 위험한 코드 except 에러이름: 대처. 여러 except 가능. else는 에러 없을 때, finally는 항상. 에러 종류를 지정해 잡는 것이 좋다.',
  terms:{ '예외':'실행 중에 생기는 에러. ValueError, ZeroDivisionError 등', '예외 처리':'에러가 나도 프로그램이 멈추지 않도록 try/except로 받아내는 것' },
  pages:[
    { title:'에러가 나도 멈추지 않게', html:`<p>지금까지는 에러가 나면 프로그램이 멈췄죠. [[예외 처리]]를 쓰면 <b>에러를 잡아서 대신 할 일을</b> 정할 수 있어요. 위험한 코드를 <code>try:</code> 안에 넣고, 에러가 났을 때 할 일을 <code>except 에러이름:</code>에 써요.</p>`,
      example:{ code:`try:\n    n = int("abc")\n    print(n)\nexcept ValueError:\n    print("숫자가 아니에요")\nprint("프로그램은 계속돼요")` } },
    { title:'여러 종류 잡기', html:`<p>except를 여러 개 둘 수 있어요. 에러 종류에 따라 다른 말을 해 줄 수 있죠. <code>except Exception as e:</code>로 모든 에러를 잡고 e에 메시지를 받을 수도 있지만, 가능하면 <b>종류를 정해서</b> 잡는 게 좋아요.</p>`,
      example:{ code:`def divide(a, b):\n    try:\n        return a / b\n    except ZeroDivisionError:\n        return "0으로 못 나눠요"\n    except TypeError:\n        return "숫자만 돼요"\n\nprint(divide(10, 2))\nprint(divide(10, 0))\nprint(divide("10", 2))` } },
    { title:'else와 finally', html:`<p><code>else:</code>는 에러가 <b>안 났을 때</b>, <code>finally:</code>는 에러가 나든 안 나든 <b>항상</b> 실행돼요. 올바른 숫자를 입력할 때까지 반복하는 패턴에서 자주 써요.</p>`,
      example:{ code:`while True:\n    try:\n        n = int(input())\n    except ValueError:\n        print("다시 입력하세요")\n    else:\n        print("입력한 수:", n)\n        break\n    finally:\n        print("(시도 끝)")`, stdin:'abc\n12' } },
  ],
  summary:['try: 안의 에러를 except로 잡는다','except ValueError: 처럼 종류를 지정','else는 성공 시, finally는 항상'] },

{ id:'L14', ch:4, n:14, title:'클래스 1: 객체 만들기', minutes:18, mode:'text',
  tutorSummary:'class 이름: 으로 설계도를 만들고 이름()으로 객체를 찍어낸다. __init__(self, ...)는 객체가 만들어질 때 실행되며 self.속성 = 값 으로 저장. self는 객체 자신.',
  terms:{ '클래스':'객체를 찍어내는 설계도(틀)', '객체':'클래스로 만들어진 실제 물건. 자기만의 속성을 가진다', '속성':'객체가 가진 값. self.name 처럼 접근', 'self':'메서드 안에서 "이 객체 자신"을 가리키는 이름' },
  pages:[
    { title:'설계도와 물건', html:`<p>[[클래스]]는 <b>붕어빵 틀</b>, [[객체]]는 그 틀로 찍어낸 <b>붕어빵</b>이에요. 틀은 하나지만 붕어빵은 팥·슈크림 등 여러 개를 만들 수 있죠.</p><p><code>class Dog:</code>로 틀을 만들고 <code>Dog()</code>로 객체를 찍어내요. 지금까지 쓴 문자열, 리스트도 사실 모두 객체였어요.</p>`,
      example:{ code:`class Dog:\n    pass\n\nd1 = Dog()\nd2 = Dog()\nprint(type(d1))\nprint(d1 is d2)` } },
    { title:'__init__과 속성', html:`<p><code>__init__</code>은 객체가 <b>만들어지는 순간 자동으로 실행</b>되는 특별한 함수예요. 여기서 <code>self.name = name</code>처럼 값을 저장하면 그 객체만의 [[속성]]이 돼요.</p><p>[[self]]는 "지금 만들어지고 있는 바로 이 객체"예요. 첫 매개변수로 꼭 써야 하지만, 부를 때는 넘기지 않아요. 파이썬이 알아서 넣어 줘요.</p>`,
      example:{ code:`class Dog:\n    def __init__(self, name, age):\n        self.name = name\n        self.age = age\n\nd = Dog("초코", 3)\nprint(d.name)\nprint(d.age)\nd.age = 4\nprint(d.age)`, trace:true } },
    { title:'여러 객체', html:`<p>같은 클래스로 만든 객체라도 속성 값은 각자 달라요. 객체를 리스트에 넣고 반복하면 "학생 명단"을 딕셔너리보다 깔끔하게 다룰 수 있어요.</p>`,
      example:{ code:`class Student:\n    def __init__(self, name, score):\n        self.name = name\n        self.score = score\n\nstudents = [Student("민수", 90), Student("영희", 85)]\nfor s in students:\n    print(s.name, s.score)` } },
  ],
  summary:['class 이름: 설계도, 이름()으로 객체 생성','__init__(self, ...)에서 self.속성 = 값','self는 객체 자신, 부를 땐 안 넘긴다'] },

{ id:'L15', ch:4, n:15, title:'클래스 2: 메서드와 상속', minutes:18, mode:'text',
  tutorSummary:'클래스 안의 함수가 메서드. 첫 매개변수 self로 자기 속성에 접근. class 자식(부모): 로 상속하면 부모 메서드를 물려받고 같은 이름으로 덮어쓸 수 있다. __str__은 print할 때 보일 문자열.',
  terms:{ '상속':'기존 클래스의 기능을 물려받아 새 클래스를 만드는 것', '오버라이딩':'부모에게 물려받은 메서드를 자식이 같은 이름으로 다시 정의해 덮어쓰는 것' },
  pages:[
    { title:'객체의 행동: 메서드', html:`<p>클래스 안에 정의한 함수가 메서드예요. <code>self</code>로 자기 속성을 읽고 바꿔요. <code>d.bark()</code>처럼 점을 찍어 불러요. 문자열의 <code>upper()</code>도 이런 메서드였어요.</p>`,
      example:{ code:`class Counter:\n    def __init__(self):\n        self.count = 0\n    def up(self):\n        self.count += 1\n    def show(self):\n        print("현재:", self.count)\n\nc = Counter()\nc.up()\nc.up()\nc.show()` } },
    { title:'상속: 물려받기', html:`<p><code>class Dog(Animal):</code>이라고 쓰면 Dog는 Animal의 모든 것을 [[상속]]받아요. 공통 기능은 부모에 한 번만 쓰고, 다른 부분만 자식에서 바꾸면 돼요. 같은 이름의 메서드를 자식에 다시 쓰면 자식 것이 우선이에요([[오버라이딩]]).</p>`,
      example:{ code:`class Animal:\n    def __init__(self, name):\n        self.name = name\n    def speak(self):\n        print(self.name, "이(가) 소리를 내요")\n\nclass Dog(Animal):\n    def speak(self):\n        print(self.name, ": 멍멍!")\n\nAnimal("동물").speak()\nDog("초코").speak()` } },
    { title:'__str__: 예쁘게 출력', html:`<p>객체를 print하면 <code>&lt;__main__.Dog object at ...&gt;</code> 같은 못생긴 글자가 나와요. <code>__str__(self)</code> 메서드가 문자열을 돌려주게 하면 그걸 대신 보여 줘요. 부모의 <code>__init__</code>을 재사용하려면 <code>super().__init__(...)</code>을 써요.</p>`,
      example:{ code:`class Dog:\n    def __init__(self, name, age):\n        self.name = name\n        self.age = age\n    def __str__(self):\n        return f"{self.name}({self.age}살)"\n\nclass Puppy(Dog):\n    def __init__(self, name):\n        super().__init__(name, 0)\n\nprint(Dog("초코", 3))\nprint(Puppy("콩이"))` } },
  ],
  summary:['메서드는 클래스 안의 함수, self로 속성 접근','class 자식(부모): 로 상속, 같은 이름이면 덮어씀','__str__은 print할 때 보일 문자열'] },

{ id:'L16', ch:4, n:16, title:'모듈과 표준 라이브러리', minutes:15, mode:'text',
  tutorSummary:'import 모듈 로 가져와 모듈.함수() 사용. from 모듈 import 이름 으로 바로 사용. random(randint, choice, seed), math(sqrt, pi, floor), datetime(date, timedelta).',
  terms:{ '모듈':'미리 만들어진 코드 묶음(도구 상자). import로 가져온다', '표준 라이브러리':'파이썬에 기본으로 들어 있는 모듈 모음' },
  pages:[
    { title:'도구 상자 가져오기', html:`<p>[[모듈]]은 누군가 미리 만들어 둔 <b>도구 상자</b>예요. <code>import math</code>로 가져와 <code>math.sqrt(16)</code>처럼 써요. 파이썬에 기본으로 들어 있는 모듈들을 [[표준 라이브러리]]라고 해요.</p><p><code>from math import sqrt</code>라고 쓰면 <code>sqrt(16)</code>처럼 앞에 모듈 이름 없이 써요.</p>`,
      example:{ code:`import math\nprint(math.sqrt(16))\nprint(math.pi)\nprint(math.floor(3.7))\nfrom math import ceil\nprint(ceil(3.2))` } },
    { title:'random: 무작위', html:`<p><code>random.randint(1, 6)</code>은 1~6 중 하나(주사위), <code>random.choice(리스트)</code>는 리스트에서 하나를 골라요. <code>random.seed(숫자)</code>를 먼저 부르면 매번 <b>같은 순서</b>의 무작위 값이 나와서 테스트하기 좋아요.</p>`,
      example:{ code:`import random\nrandom.seed(1)\nprint(random.randint(1, 6))\nprint(random.choice(["가위", "바위", "보"]))\nnums = [1, 2, 3, 4, 5]\nrandom.shuffle(nums)\nprint(nums)` } },
    { title:'datetime: 날짜', html:`<p><code>datetime.date(2024, 3, 1)</code>로 날짜를 만들고 <code>.weekday()</code>로 요일(0=월요일)을 알 수 있어요. 날짜끼리 빼면 며칠 차이인지 나오고, <code>timedelta(days=7)</code>을 더하면 일주일 뒤예요.</p>`,
      example:{ code:`from datetime import date, timedelta\nd = date(2024, 3, 1)\nprint(d.weekday())\nprint(d + timedelta(days=7))\nprint((date(2024, 12, 25) - d).days)` } },
  ],
  summary:['import 모듈 → 모듈.함수()','from 모듈 import 이름 → 바로 사용','random.seed로 같은 결과 재현'] },

{ id:'L17', ch:5, n:17, title:'파일 입출력', minutes:15, mode:'text',
  tutorSummary:'with open(파일, "w") as f: f.write(...) 로 쓰기, "a"는 이어쓰기, "r"은 읽기. f.read()는 전체, f.readlines()는 줄 목록, for line in f: 로 한 줄씩. strip()으로 줄바꿈 제거. encoding="utf-8".',
  pages:[
    { title:'파일에 쓰기', html:`<p>프로그램이 끝나면 변수는 사라지지만 <b>파일</b>은 남아요. <code>with open("이름.txt", "w") as f:</code>로 파일을 열고 <code>f.write("내용\\n")</code>으로 써요. <code>with</code>는 블록이 끝나면 파일을 자동으로 닫아 줘요.</p><p><code>"w"</code>는 새로 쓰기(기존 내용 삭제), <code>"a"</code>는 뒤에 이어쓰기예요. 한글은 <code>encoding="utf-8"</code>을 붙이는 습관을 들이세요.</p>`,
      example:{ code:`with open("memo.txt", "w", encoding="utf-8") as f:\n    f.write("첫 줄\\n")\n    f.write("둘째 줄\\n")\nwith open("memo.txt", "a", encoding="utf-8") as f:\n    f.write("이어 쓴 줄\\n")\nprint("저장 완료")` } },
    { title:'파일 읽기', html:`<p><code>"r"</code>로 열고 <code>f.read()</code>로 전체를 읽거나 <code>for line in f:</code>로 한 줄씩 읽어요. 각 줄 끝에는 줄바꿈 문자가 붙어 있어서 <code>line.strip()</code>으로 떼어 내요.</p>`,
      example:{ code:`with open("memo.txt", "w", encoding="utf-8") as f:\n    f.write("사과\\n배\\n포도\\n")\nwith open("memo.txt", "r", encoding="utf-8") as f:\n    for line in f:\n        print("읽음:", line.strip())\nwith open("memo.txt", encoding="utf-8") as f:\n    lines = f.readlines()\nprint(len(lines), "줄")` } },
    { title:'파일이 없을 때', html:`<p>없는 파일을 읽으면 <code>FileNotFoundError</code>가 나요. 예외 처리로 받아 주면 안전해요. 이 앱의 파일은 브라우저 안 가상 공간에 만들어져요. 한 번의 실행 안에서 쓰고 읽을 수 있어요.</p>`,
      example:{ code:`try:\n    with open("없는파일.txt") as f:\n        print(f.read())\nexcept FileNotFoundError:\n    print("파일이 없어요")` } },
  ],
  summary:['with open(파일, "w") as f: f.write()','"r"로 열어 for line in f: 한 줄씩','line.strip()으로 줄바꿈 제거'] },

{ id:'L18', ch:5, n:18, title:'람다와 자주 쓰는 패턴', minutes:18, mode:'text',
  tutorSummary:'lambda 매개변수: 식 은 한 줄짜리 이름 없는 함수. sorted(목록, key=함수, reverse=True). map(함수, 목록), filter(함수, 목록)은 list()로 감싼다. enumerate, zip, sum/min/max, join.',
  terms:{ '람다':'lambda x: x * 2 처럼 한 줄로 쓰는 이름 없는 작은 함수' },
  pages:[
    { title:'한 줄짜리 함수', html:`<p>[[람다]]는 이름 없이 한 줄로 쓰는 작은 함수예요. <code>lambda x: x * 2</code>는 <code>def f(x): return x * 2</code>와 같아요. 다른 함수에 "기준"을 넘겨줄 때 많이 써요.</p>`,
      example:{ code:`double = lambda x: x * 2\nprint(double(5))\nwords = ["banana", "kiwi", "apple"]\nprint(sorted(words, key=lambda w: len(w)))\nprint(sorted(words, reverse=True))` } },
    { title:'map, filter', html:`<p><code>map(함수, 목록)</code>은 모든 값에 함수를 적용하고, <code>filter(함수, 목록)</code>은 함수가 True인 값만 골라요. 결과는 <code>list()</code>로 감싸야 리스트로 보여요. 컴프리헨션과 같은 일을 해요.</p>`,
      example:{ code:`nums = ["1", "2", "3"]\nprint(list(map(int, nums)))\nprint(sum(map(int, nums)))\nprint(list(filter(lambda x: x % 2 == 0, range(10))))` } },
    { title:'자주 쓰는 패턴 모음', html:`<p><code>enumerate</code>는 번호와 값을 같이, <code>zip</code>은 두 목록을 나란히, <code>", ".join(목록)</code>은 문자열 목록을 하나로 합쳐요. <code>max(목록, key=...)</code>로 기준에 따른 최대값도 찾아요.</p>`,
      example:{ code:`names = ["민수", "영희"]\nscores = [90, 85]\nfor i, n in enumerate(names):\n    print(i, n)\nfor n, s in zip(names, scores):\n    print(n, s)\nprint(", ".join(names))\nprint(max(scores), min(scores))` } },
  ],
  summary:['lambda x: 식 은 한 줄 함수','sorted(목록, key=기준), map, filter','enumerate, zip, join'] },

{ id:'B3P1', lesson:'B3', type:'code', title:'간단한 가계부', boss:true, tags:['딕셔너리','문자열','반복'], inputExample:'추가 식비 5000\n추가 교통 1500\n추가 식비 3000\n합계\n검색 식비\n검색 문화\n끝',
  project:{ steps:['빈 딕셔너리와 무한 반복 준비','"추가 항목 금액" 명령: 항목에 금액 누적, "기록: 항목 금액" 출력','"합계" 명령: 전체 합 출력','"검색 항목" 명령: 금액 또는 "항목 없음" 출력','"끝" 명령: "종료" 출력하고 반복 탈출'] },
  prompt:'명령을 한 줄씩 입력받아 처리하는 가계부예요.<ul><li><code>추가 항목 금액</code> → 그 항목에 금액을 더하고 <code>기록: 항목 금액</code> 출력 (금액은 이번에 추가한 값)</li><li><code>합계</code> → <code>합계: 총액</code> 출력</li><li><code>검색 항목</code> → <code>항목: 누적금액</code> 또는 <code>항목 없음</code> 출력</li><li><code>끝</code> → <code>종료</code> 출력하고 끝</li></ul>',
  starter:'book = {}\nwhile True:\n    parts = input().split()\n    cmd = parts[0]\n    # 여기서부터 명령을 처리하세요\n',
  solution:'book = {}\nwhile True:\n    parts = input().split()\n    cmd = parts[0]\n    if cmd == "끝":\n        print("종료")\n        break\n    elif cmd == "추가":\n        item = parts[1]\n        amount = int(parts[2])\n        book[item] = book.get(item, 0) + amount\n        print("기록:", item, amount)\n    elif cmd == "합계":\n        print("합계:", sum(book.values()))\n    elif cmd == "검색":\n        item = parts[1]\n        if item in book:\n            print(f"{item}: {book[item]}")\n        else:\n            print("항목 없음")',
  tests:[{input:'추가 식비 5000\n추가 교통 1500\n추가 식비 3000\n합계\n검색 식비\n검색 문화\n끝', output:'기록: 식비 5000\n기록: 교통 1500\n기록: 식비 3000\n합계: 9500\n식비: 8000\n항목 없음\n종료'},{input:'합계\n끝', output:'합계: 0\n종료'},{input:'추가 간식 700\n검색 간식\n끝', output:'기록: 간식 700\n간식: 700\n종료'},{input:'추가 a 1\n추가 a 1\n추가 a 1\n합계\n끝', output:'기록: a 1\n기록: a 1\n기록: a 1\n합계: 3\n종료'},{input:'검색 x\n추가 x 10\n검색 x\n끝', output:'항목 없음\n기록: x 10\nx: 10\n종료'}],
  hints:['parts[0]이 명령, parts[1], parts[2]가 항목과 금액이에요','누적은 book[item] = book.get(item, 0) + amount','합계는 sum(book.values()), 검색은 if item in book:'] },

// ---------------- B4 ----------------
{ id:'B4P1', lesson:'B4', type:'code', title:'클래스로 만든 가위바위보', boss:true, tags:['클래스','조건','반복'], inputExample:'3\n가위 보\n바위 바위\n보 바위',
  prompt:'첫 줄에 라운드 수 n, 다음 n줄에 <code>내손 컴퓨터손</code>이 와요(가위/바위/보). <code>Player</code> 클래스(이름, 점수)를 만들고, 라운드마다 <code>n라운드: 승리</code>/<code>패배</code>/<code>무승부</code>를 출력한 뒤 마지막에 <code>나 x : y 컴퓨터</code>와 <code>최종 승자: 나</code>/<code>컴퓨터</code>/<code>무승부</code>를 출력하세요. 이긴 사람만 1점을 얻어요.',
  starter:'class Player:\n    def __init__(self, name):\n        self.name = name\n        self.score = 0\n\ndef judge(a, b):\n    # a가 이기면 1, 지면 -1, 비기면 0을 돌려주세요\n    pass\n',
  solution:'class Player:\n    def __init__(self, name):\n        self.name = name\n        self.score = 0\n\ndef judge(a, b):\n    if a == b:\n        return 0\n    wins = {"가위": "보", "바위": "가위", "보": "바위"}\n    if wins[a] == b:\n        return 1\n    return -1\n\nme = Player("나")\ncom = Player("컴퓨터")\nn = int(input())\nfor r in range(1, n + 1):\n    a, b = input().split()\n    result = judge(a, b)\n    if result == 1:\n        me.score += 1\n        print(f"{r}라운드: 승리")\n    elif result == -1:\n        com.score += 1\n        print(f"{r}라운드: 패배")\n    else:\n        print(f"{r}라운드: 무승부")\nprint(f"{me.name} {me.score} : {com.score} {com.name}")\nif me.score > com.score:\n    print("최종 승자: 나")\nelif me.score < com.score:\n    print("최종 승자: 컴퓨터")\nelse:\n    print("최종 승자: 무승부")',
  tests:[{input:'3\n가위 보\n바위 바위\n보 바위', output:'1라운드: 승리\n2라운드: 무승부\n3라운드: 승리\n나 2 : 0 컴퓨터\n최종 승자: 나'},{input:'2\n가위 바위\n보 가위', output:'1라운드: 패배\n2라운드: 패배\n나 0 : 2 컴퓨터\n최종 승자: 컴퓨터'},{input:'2\n바위 가위\n가위 바위', output:'1라운드: 승리\n2라운드: 패배\n나 1 : 1 컴퓨터\n최종 승자: 무승부'},{input:'1\n보 보', output:'1라운드: 무승부\n나 0 : 0 컴퓨터\n최종 승자: 무승부'},{input:'4\n바위 보\n바위 보\n보 가위\n가위 보', output:'1라운드: 패배\n2라운드: 패배\n3라운드: 패배\n4라운드: 승리\n나 1 : 3 컴퓨터\n최종 승자: 컴퓨터'}],
  hints:['가위는 보를, 바위는 가위를, 보는 바위를 이겨요. 딕셔너리로 "누가 누구를 이기는지" 만들면 편해요','judge가 1/-1/0을 돌려주면 점수와 메시지를 나누기 쉬워요','wins = {"가위": "보", "바위": "가위", "보": "바위"}; if wins[a] == b: return 1'] },

  solution:'n = int(input())\nwith open("lines.txt", "w", encoding="utf-8") as f:\n    for i in range(n):\n        f.write(input() + "\\n")\nwith open("lines.txt", "r", encoding="utf-8") as f:\n    lines = f.readlines()\nprint(f"{len(lines)}줄")', tests:[{input:'3\n사과\n배\n포도', output:'3줄'},{input:'1\nx', output:'1줄'},{input:'5\na\nb\nc\nd\ne', output:'5줄'}],

{ id:'L17P4', lesson:'L17', type:'fill', title:'빈칸 채우기: with', prompt:'파일을 자동으로 닫아 주는 구문을 완성하세요.', tags:['파일'],

{ id:'L17P5', lesson:'L17', type:'code', title:'정렬해서 읽기', prompt:'단어들을 한 줄로 입력받아 <code>words.txt</code>에 한 줄에 하나씩 저장하세요. 파일을 다시 읽어 단어를 사전순으로 정렬해 한 줄에 하나씩 출력하세요.', tags:['파일','리스트'], inputExample:'배 사과 포도 감',
  solution:'words = input().split()\nwith open("words.txt", "w", encoding="utf-8") as f:\n    for w in words:\n        f.write(w + "\\n")\nwith open("words.txt", "r", encoding="utf-8") as f:\n    saved = [line.strip() for line in f]\nfor w in sorted(saved):\n    print(w)', tests:[{input:'배 사과 포도 감', output:'감\n배\n사과\n포도'},{input:'c a b', output:'a\nb\nc'},{input:'하나', output:'하나'}],

// ---------------- B5 ----------------
{ id:'B5P1', lesson:'B5', type:'code', title:'텍스트 RPG 전투', boss:true, tags:['클래스','모듈','파일','반복'], inputExample:'1\n공격\n공격\n회복\n공격\n공격\n공격\n공격\n공격',
  project:{ steps:['Hero(hp 30, 공격 3~6)·Monster(hp 20, 공격 2~8) 클래스 만들기','첫 줄의 씨앗으로 random.seed 설정','명령 "공격": 용사가 먼저 때리고, 몬스터가 살아 있으면 반격','명령 "회복": 용사 hp +5(최대 30), 몬스터는 반격','누군가 쓰러지면 결과를 battle.txt에 저장하고 파일 내용 출력'] },
  prompt:'전투 시뮬레이션이에요. 첫 줄에 씨앗 숫자, 이후 줄마다 명령(<code>공격</code> 또는 <code>회복</code>)이 와요.<ul><li>용사: hp 30, 공격력 <code>random.randint(3, 6)</code> / 몬스터: hp 20, 공격력 <code>random.randint(2, 8)</code></li><li><code>공격</code>: 용사가 때리고 <code>용사의 공격! 몬스터 hp: n</code> 출력. 몬스터 hp가 0 이하가 아니면 몬스터가 반격하고 <code>몬스터의 공격! 용사 hp: n</code> 출력</li><li><code>회복</code>: 용사 hp를 5 올리고(최대 30) <code>회복! 용사 hp: n</code> 출력, 이어서 몬스터가 반격</li><li>몬스터 hp가 0 이하가 되면 <code>승리!</code>, 용사 hp가 0 이하가 되면 <code>패배...</code>를 출력하고 끝. 결과 한 줄(<code>승리!</code> 또는 <code>패배...</code>)을 <code>battle.txt</code>에 저장한 뒤 파일을 읽어 <code>저장된 결과: 승리!</code>처럼 출력</li></ul>난수는 반드시 "용사 공격 → 몬스터 공격" 순서로 한 번씩만 뽑으세요.',
  starter:'import random\n\nclass Hero:\n    def __init__(self):\n        self.hp = 30\n    def attack(self):\n        return random.randint(3, 6)\n\nclass Monster:\n    def __init__(self):\n        self.hp = 20\n    def attack(self):\n        return random.randint(2, 8)\n\nrandom.seed(int(input()))\nhero = Hero()\nmon = Monster()\n# 여기서부터 전투 반복을 만드세요\n',
  solution:'import random\n\nclass Hero:\n    def __init__(self):\n        self.hp = 30\n    def attack(self):\n        return random.randint(3, 6)\n\nclass Monster:\n    def __init__(self):\n        self.hp = 20\n    def attack(self):\n        return random.randint(2, 8)\n\nrandom.seed(int(input()))\nhero = Hero()\nmon = Monster()\nresult = None\nwhile result is None:\n    cmd = input()\n    if cmd == "공격":\n        mon.hp -= hero.attack()\n        print("용사의 공격! 몬스터 hp:", mon.hp)\n        if mon.hp <= 0:\n            result = "승리!"\n            break\n    elif cmd == "회복":\n        hero.hp = min(30, hero.hp + 5)\n        print("회복! 용사 hp:", hero.hp)\n    hero.hp -= mon.attack()\n    print("몬스터의 공격! 용사 hp:", hero.hp)\n    if hero.hp <= 0:\n        result = "패배..."\nprint(result)\nwith open("battle.txt", "w", encoding="utf-8") as f:\n    f.write(result)\nwith open("battle.txt", "r", encoding="utf-8") as f:\n    print("저장된 결과:", f.read())',

const Content = {
  lessonMap: {}, problemMap: {}, byLesson: {},
  init() {
    LESSONS.forEach(l => { this.lessonMap[l.id] = l; this.byLesson[l.id] = []; });
    PROBLEMS.forEach(p => { this.problemMap[p.id] = p; (this.byLesson[p.lesson] = this.byLesson[p.lesson] || []).push(p); });
    // 자체 검사
    const seen = new Set(); const warn = (m) => console.warn('[콘텐츠 검사] ' + m);
    PROBLEMS.forEach(p => {
      if (seen.has(p.id)) warn(`id 중복: ${p.id}`); seen.add(p.id);
      if (!this.lessonMap[p.lesson]) warn(`없는 레슨 참조: ${p.id} → ${p.lesson}`);
      if (['block','code'].includes(p.type) && !(p.tests && p.tests.length)) warn(`테스트 없는 실행형 문제: ${p.id}`);
      if (p.type === 'bug' && !(p.bug && p.bug.tests && p.bug.tests.length)) warn(`테스트 없는 버그 문제: ${p.id}`);
      if (!(p.hints && p.hints.length >= 3)) warn(`힌트 3개 미만: ${p.id}`);
      if (!(p.tags && p.tags.length)) warn(`개념 태그 없음: ${p.id}`);
      if (p.boss && this.tests(p).length < 5) warn(`보스 테스트 5개 미만: ${p.id}`);
    });
    LESSONS.forEach(l => { if (!l.boss && l.id !== 'L0' && this.byLesson[l.id].length < 4) warn(`문제 4개 미만 레슨: ${l.id}`); });
  },
  lesson(id) { return this.lessonMap[id]; },
  problem(id) { return this.problemMap[id]; },
  problemsOf(lid) { return this.byLesson[lid] || []; },
  tests(p) { return p.type === 'bug' ? (p.bug.tests || []) : (p.tests || []); },
  lessonsOfChapter(ch) { return LESSONS.filter(l => l.ch === ch); },
  orderedLessons() { return LESSONS.slice(); },
  blocksUpTo(lid) { // 누적 툴박스
    const out = ['text_print','py_print_many']; const idx = LESSONS.findIndex(l => l.id === lid);
    for (let i = 0; i <= idx; i++) (LESSONS[i].blocks || []).forEach(b => { if (!out.includes(b)) out.push(b); });
    return out;
  },
  // {{식}} 치환. params 없으면 vary 기본값(첫 값)
  defaultParams(p) { const out = {}; if (p.vary) for (const k in p.vary) out[k] = p.vary[k][0]; return out; },
  randomParams(p) { const out = {}; if (p.vary) for (const k in p.vary) { const r = p.vary[k]; out[k] = (r.length === 2 && typeof r[0] === 'number' && typeof r[1] === 'number' && r[1] > r[0] + 1) ? r[0] + Math.floor(Math.random() * (r[1] - r[0] + 1)) : r[Math.floor(Math.random() * r.length)]; } return out; },
  // {{식}} 계산기: 숫자·파라미터 이름·+ - * / % 괄호만 지원 (eval 금지 환경에서도 동작)
  evalExpr(src, params) {
    const toks = src.match(/\d+(?:\.\d+)?|[A-Za-z_]\w*|[-+*/%()]/g) || []; let i = 0;
    const peek = () => toks[i], next = () => toks[i++];
    const atom = () => { const t = next(); if (t === '(') { const v = expr(); next(); return v; } if (t === '-') return -atom(); if (/^\d/.test(t)) return Number(t); if (t in params) return typeof params[t] === 'number' ? params[t] : String(params[t]); throw new Error('bad token ' + t); };
    const term = () => { let v = atom(); while (['*', '/', '%'].includes(peek())) { const op = next(), r = atom(); v = op === '*' ? v * r : op === '/' ? v / r : v % r; } return v; };
    const expr = () => { let v = term(); while (['+', '-'].includes(peek())) { const op = next(), r = term(); v = op === '+' ? v + r : v - r; } return v; };
    const v = expr(); if (i < toks.length) throw new Error('trailing'); return v;
  },
  instantiate(p, params) {
    if (!p.vary) return p;
    if (!params || !Object.keys(params).length) params = this.defaultParams(p);
    const keys = Object.keys(params), vals = keys.map(k => params[k]);
    const sub = (s) => typeof s !== 'string' ? s : s.replace(/\{\{([^}]+)\}\}/g, (m, e) => { try { return String(this.evalExpr(e, params)); } catch (err) { return m; } });
    const q = JSON.parse(JSON.stringify(p)); q.params = params;
    q.prompt = sub(q.prompt); q.solution = sub(q.solution); q.starter = sub(q.starter); q.inputExample = sub(q.inputExample);
    q.hints = (q.hints || []).map(sub);
    if (q.tests) q.tests = q.tests.map(t => ({ ...t, input: sub(t.input), output: sub(t.output), call: sub(t.call), ret: sub(t.ret) }));
    q.varied = JSON.stringify(params) !== JSON.stringify(this.defaultParams(p));
    return q;
  },
};

def _pa_safe(v):
    try: r=repr(v)
    except Exception: r='?'
    return r if len(r)<=80 else r[:77]+'...'

def __pa_run(code, call=None, trace=False, maxsteps=500):
    _pt.reset()
    ns={'__name__':'__main__'}
    res={'ok':True}
    steps=[]; buf=[]; stack=[]
    class _Cap:
        def write(self,t): buf.append(t); return len(t)
        def flush(self): pass
    def tr(frame,event,arg):
        if frame.f_code.co_filename!='<user>': return None
        if event=='call': stack.append(frame.f_code.co_name)
        if event in ('line','return'):
            if len(steps)>=maxsteps: raise _PAStop()
            loc={}
            for k,v in frame.f_locals.items():
                if k.startswith('__') or callable(v) or isinstance(v,types.ModuleType): continue
                loc[k]=_pa_safe(v)
            steps.append({'line':frame.f_lineno,'vars':loc,'stack':list(stack),'out':''.join(buf)[-3000:],'event':event})
        if event=='return' and stack: stack.pop()
        return tr
    old=sys.stdout
    try:
        if trace:
            sys.stdout=_Cap(); sys.settrace(tr)
        exec(compile(code,'<user>','exec'),ns)
        if call: res['ret']=repr(eval(call,ns))
    except _PAStop:
        res['truncated']=True
    except SystemExit:
        pass
    except BaseException as e:
        res['ok']=False; res['ename']=type(e).__name__; res['emsg']=str(e)
        line=None
        if isinstance(e,SyntaxError): line=e.lineno
        else:
            try:
                for fr in traceback.extract_tb(e.__traceback__):
                    if fr.filename=='<user>': line=fr.lineno
            except Exception: pass
        res['line']=line
        try: res['tb']=''.join(traceback.format_exception_only(type(e),e)).strip()
        except Exception: res['tb']=res['ename']+': '+res['emsg']
    finally:
        if trace:
            sys.settrace(None); sys.stdout=old
            res['trace']=steps; res['out']=''.join(buf)
    res['segs']=_pt.segs[:5000]; res['cmds']=_pt.cmds; res['turtleUsed']=_pt.used; res['nsegs']=len(_pt.segs)
    return json.dumps(res)

def __pa_compile(code):
    try:
        compile(code,'<user>','exec'); return json.dumps({'ok':True})
    except SyntaxError as e:
        return json.dumps({'ok':False,'line':e.lineno,'msg':e.msg,'ename':type(e).__name__})

  },
  bossXp(p) { const lesson = Content.lesson(p.lesson); const chProbs = PROBLEMS.filter(q => Content.lesson(q.lesson).ch === lesson.ch && !q.boss); const sum = chProbs.reduce((a, q) => a + (q.xp || CONFIG.XP[q.type] || 10), 0); return Math.max(60, Math.round(sum * CONFIG.BOSS_XP_RATIO)); },
  failProblem(p) { const rec = Store.prob(p.id); rec.fails++; rec.attempts++; this.combo = 0; this.noHintStreak = 0; if (rec.status !== 'clear') rec.status = 'try'; Store.save(); },

const Tutor = {

  async test() { return this.call({ system: '한 단어로만 답해.', messages: [{ role: 'user', content: '안녕' }], maxTokens: 20 }); },
  context({ lesson, problem, code, lastRun, hints, answerSeen, trace, pageHtml }) {

        const np = { id: 'MY_' + uid(), lesson: p.lesson, type: 'code', title: '🎲 ' + q.title, prompt: esc(q.prompt).replace(/\n/g, '<br>'), tags: p.tags, hints: q.hints && q.hints.length >= 3 ? q.hints : ['문제를 다시 읽어 보세요', '원래 문제의 풀이를 떠올리세요', q.solution.split('\n')[0]], starter: q.starter || '', solution: q.solution, tests: q.tests, myProblem: true };
        Store.data.myProblems.push(np); Content.problemMap[np.id] = np; Content.byLesson[np.lesson] = Content.byLesson[np.lesson] || []; Content.byLesson[np.lesson].push(np); PROBLEMS.push(np); Store.save();
        this.log().push({ role: 'assistant', content: `새 문제 "${q.title}"를 만들었어요! 내 문제집에 저장했고, 복습 큐에도 들어가요.` }); this.renderLog(); UI.toast('🎲 새 문제가 준비됐어요'); setTimeout(() => { this.close(); if (c.onNewProblem) c.onNewProblem(np); }, 800);
      } catch (e) { this.log().push({ role: 'assistant', content: '지금은 만들 수 없어요. (' + (e.message || '') + ')' }); this.renderLog(); }
    }
  },
};

// ---------- 온보딩 ----------
const Onboarding = {
  async start(replay = false) {
    const d = Store.data; let color = d.mascotColor; let nick = d.nick;
    await UI.modal({ title: `👋 ${T.appName}에 온 걸 환영해요!`, wide: true, body: `<p>닉네임을 정하고(선택) 마스코트 색을 골라 주세요.</p><input class="input" id="obNick" placeholder="닉네임 (선택)" value="${esc(nick)}" maxlength="12"><div class="ob-colors">${MASCOT_COLORS.map((c, i) => `<button class="ob-c ${i === color ? 'on' : ''}" data-c="${i}">${mascotSVG({ stage: 1, color: i, size: 64, mood: 'happy' })}</button>`).join('')}</div>`, buttons: [{ label: '다음', cls: 'primary', block: true, onClick: (ov) => { nick = $('#obNick', ov).value.trim(); } }], onOpen: (ov) => { $$('.ob-c', ov).forEach(b => b.onclick = () => { $$('.ob-c', ov).forEach(x => x.classList.remove('on')); b.classList.add('on'); color = +b.dataset.c; }); } });
    d.nick = nick; d.mascotColor = color;
    let goal = d.dailyGoal;
    await UI.modal({ title: '🎯 하루에 몇 문제?', body: `<p>작게 시작해도 괜찮아요. 매일 하는 게 중요해요.</p><div class="seg big" id="obGoal">${CONFIG.DAILY_GOAL_OPTIONS.map(n => `<button class="${n === goal ? 'on' : ''}" data-g="${n}">${n}문제</button>`).join('')}</div>`, buttons: [{ label: '다음', cls: 'primary', block: true }], onOpen: (ov) => { $$('#obGoal button', ov).forEach(b => b.onclick = () => { $$('#obGoal button', ov).forEach(x => x.classList.remove('on')); b.classList.add('on'); goal = +b.dataset.g; }); } });
    d.dailyGoal = goal; d.onboarded = true; Store.save(); UI.renderTopbar();
    UI.go('home', {}, false); await sleep(300);
    const steps = [['.node.cur', '지도에서 레슨을 골라요. 반짝이는 곳이 지금 할 레슨이에요.'], ['.tb-xp', '문제를 풀면 XP가 쌓이고 레벨이 올라요.'], ['.card.prof', '프로필·뱃지·보관함은 여기서 봐요.'], ['#tbSettings', '설정에서 테마와 선생님(API 키)을 설정해요.']];
    for (const [sel, text] of steps) { const el = $(sel); if (!el) continue; const skip = await this.point(el, text); if (skip) break; }
    UI.go('lesson', { lessonId: 'L0', page: 0, autoRun: true });
  },
  point(el, text) { return new Promise(res => { const r = el.getBoundingClientRect(); const ov = document.createElement('div'); ov.className = 'ob-ov'; ov.innerHTML = `<div class="ob-ring" style="left:${r.left - 6}px;top:${r.top - 6 + scrollY}px;width:${r.width + 12}px;height:${r.height + 12}px"></div><div class="ob-tip" style="left:${Math.max(10, Math.min(innerWidth - 300, r.left))}px;top:${r.bottom + 12 + scrollY}px"><div>${text}</div><div class="row"><button class="btn primary sm" data-a="n">다음</button><button class="btn sm" data-a="s">건너뛰기</button></div></div>`; document.body.appendChild(ov); $$('button', ov).forEach(b => b.onclick = () => { ov.remove(); res(b.dataset.a === 's'); }); }); },
};

// ---------- 초기화 ----------
window.addEventListener('DOMContentLoaded', () => {
  Store.load(); Content.init(); (Store.data.myProblems || []).forEach(np => { if (!Content.problemMap[np.id]) { Content.problemMap[np.id] = np; (Content.byLesson[np.lesson] = Content.byLesson[np.lesson] || []).push(np); PROBLEMS.push(np); } });
  UI.applyTheme(); Confetti.init(); Loader.init(); QuickKeys.init(); Tutor.ui.init();
  Py.start(); // 홈 진입과 동시에 백그라운드 로딩
  Game.touchStreak(); Store.save();
  document.addEventListener('click', () => { Audio._ctx(); }, { once: true });
  if (!Store.data.onboarded) { UI.go('home', {}, false); Onboarding.start(); } else UI.go('home', {}, false);
});

</script>
